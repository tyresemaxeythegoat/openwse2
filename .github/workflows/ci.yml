name: Engine CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-linux:
    name: Host C++20 (Linux clang++)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build engine host tests
        run: |
          CXX=clang++ cmake -S . -B build-host -DWSE_BUILD_HEADER_CHECKS=ON
          cmake --build build-host -j"$(nproc)"

      - name: Run CTest suites
        run: |
          ctest --test-dir build-host --output-on-failure --no-tests=error

      - name: Validate emitted SPIR-V 1.0 modules with spirv-val
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools
          spv_dir="$(mktemp -d)"
          trap 'rm -rf "${spv_dir}"' EXIT
          WSE_DUMP_SPIRV_DIR="${spv_dir}" ./build-host/asset_test
          shopt -s nullglob
          spvs=("${spv_dir}"/*.spv)
          if [ "${#spvs[@]}" -eq 0 ]; then
            echo "No SPIR-V files dumped" >&2
            exit 1
          fi
          for f in "${spvs[@]}"; do
            spirv-val --target-env vulkan1.0 "${f}"
          done
          echo "Validated ${#spvs[@]} SPIR-V 1.0 modules with spirv-val"

      - name: Check WSE opcode status
        run: python3 tools/extract_wse_opcodes.py --check

      - name: Check evidence citations
        run: python3 tools/check_citations.py --self-test --docs

  host-sanitizers:
    name: Host ASan + UBSan (Linux clang++)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build with sanitizers
        run: |
          CXX=clang++ cmake -S . -B build-san -DWSE_SANITIZE=ON
          cmake --build build-san -j"$(nproc)"

      - name: Run CTest suites under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          ctest --test-dir build-san --output-on-failure --no-tests=error

  # Phase 5 translator on the host against Ubuntu's LLVM 18 + LLD (synthetic code only).
  recomp-host:
    name: Recompiler (Linux, LLVM 18)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18 + LLD development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev liblld-18-dev clang-18 lld-18 zlib1g-dev libzstd-dev \
            libxml2-dev libedit-dev libffi-dev libncurses-dev libcurl4-openssl-dev

      - name: Build and run the translator test
        run: |
          CXX=clang++-18 cmake -S . -B build-recomp -DWSE_ENABLE_LLVM=ON \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm -DLLD_DIR=/usr/lib/llvm-18/lib/cmake/lld \
            -DWSE_REQUIRE_RECOMP_CORPUS=ON
          cmake --build build-recomp -j"$(nproc)" --target recomp_llvm_test recomp_test
          ./build-recomp/recomp_test
          ./build-recomp/recomp_llvm_test --record build-recomp/corpus_results.txt || {
            WSE_R1_DUMP_EXPORT=f64_arith ./build-recomp/recomp_llvm_test 2>&1 | sed -n '/=== wse_fn/,/^}/p' | head -400
            exit 1
          }
          mkdir -p corpus-artifact
          cp build-recomp/recomp_corpus/corpus.exe build-recomp/corpus_results.txt corpus-artifact/

      # The corpus PE (our own C) and its native x86 results, for the arm64 job.
      - uses: actions/upload-artifact@v4
        with:
          name: recomp-corpus
          path: corpus-artifact/
          retention-days: 7

  # R2: the corpus translated for AArch64 on GitHub's arm64 runner, checked against the x86 native
  # results `recomp-host` recorded (`docs/RECOMP_PLAN.md` "R2 design"). Synthetic code only.
  recomp-arm64:
    name: Recompiler (Linux arm64, LLVM 18)
    runs-on: ubuntu-24.04-arm
    needs: recomp-host
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18 + LLD development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18-dev liblld-18-dev zlib1g-dev libzstd-dev \
            libxml2-dev libedit-dev libffi-dev libncurses-dev libcurl4-openssl-dev

      - uses: actions/download-artifact@v4
        with:
          name: recomp-corpus
          path: corpus-artifact

      - name: Build and check the translated corpus
        run: |
          CXX=clang++-18 cmake -S . -B build-recomp -DWSE_ENABLE_LLVM=ON \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm -DLLD_DIR=/usr/lib/llvm-18/lib/cmake/lld
          cmake --build build-recomp -j"$(nproc)" --target recomp_llvm_test recomp_test
          ./build-recomp/recomp_test
          ./build-recomp/recomp_llvm_test --check corpus-artifact/corpus.exe corpus-artifact/corpus_results.txt

  # LLVM + LLD 18.1.8 for arm64-v8a, AArch64 target only, static, built once and cached.
  # Source: the llvmorg-18.1.8 tag, checked against its commit below.
  llvm-android:
    name: LLVM 18.1.8 for Android (cached)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      WSE_NDK_VERSION: '30.0.16248370'
      WSE_LLVM_TAG: 'llvmorg-18.1.8'
      WSE_LLVM_COMMIT: '3b5b5c1ec4a3095ab096dd780e84d7ab81f3d7ff'
    steps:
      - name: Restore cached LLVM install
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-android
          key: llvm-android-18.1.8-ndk30.0.16248370-minsize-aarch64-v1

      - name: Build LLVM + LLD
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "${sdk_root}/ndk/${WSE_NDK_VERSION}" ]; then
            (yes || true) | "${sdk_root}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${WSE_NDK_VERSION}" > /dev/null
          fi
          ndk="${sdk_root}/ndk/${WSE_NDK_VERSION}"

          git init -q llvm-project
          cd llvm-project
          git remote add origin https://github.com/llvm/llvm-project.git
          git sparse-checkout set --no-cone /llvm /lld /cmake /third-party /libunwind/include
          git fetch -q --depth 1 origin "refs/tags/${WSE_LLVM_TAG}"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${WSE_LLVM_COMMIT}"
          cd ..

          cmake -G Ninja -S llvm-project/llvm -B llvm-build \
            -DCMAKE_TOOLCHAIN_FILE="${ndk}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_INSTALL_PREFIX="${HOME}/llvm-android" \
            -DLLVM_ENABLE_PROJECTS=lld \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DLLVM_HOST_TRIPLE=aarch64-linux-android29 \
            -DLLVM_DEFAULT_TARGET_TRIPLE=aarch64-linux-android29 \
            -DLLVM_BUILD_TOOLS=OFF -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_ENABLE_LIBEDIT=OFF -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_RTTI=OFF -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_PLUGINS=OFF
          cmake --build llvm-build -j"$(nproc)"
          cmake --install llvm-build
          du -sh "${HOME}/llvm-android"

  android-arm64:
    name: Android NDK (aarch64-linux-android29)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Locate Android NDK and compile all headers & tests
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "${ndk}" ] && [ -n "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_HOME}/ndk" ]; then
            ndk="$(find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          if [ -z "${ndk}" ] || [ ! -d "${ndk}" ]; then
            echo "Android NDK not found on runner" >&2
            exit 1
          fi
          echo "Using Android NDK: ${ndk}"

          clang_bin="${ndk}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          if [ ! -x "${clang_bin}" ]; then
            echo "Missing NDK compiler wrapper: ${clang_bin}" >&2
            exit 1
          fi
          header_out="$(mktemp -d)"
          trap 'rm -rf "${header_out}"' EXIT

          while IFS= read -r -d '' hdr; do
            rel="${hdr#engine/include/}"
            obj="${header_out}/$(echo "${rel}" | tr '/.' '__').o"
            stub="${header_out}/$(echo "${rel}" | tr '/.' '__').cpp"
            printf '#include "%s"\n' "${rel}" > "${stub}"
            echo "arm64 header check: ${rel}"
            "${clang_bin}" -std=c++20 -O2 -Wall -Wextra -Werror -I engine/include -c "${stub}" -o "${obj}"
          done < <(find engine/include -name '*.h' -print0 | sort -z)

          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="${ndk}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DWSE_BUILD_HEADER_CHECKS=ON
          cmake --build build-android -j"$(nproc)"

  android-apk:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-24.04
    needs: llvm-android
    steps:
      - uses: actions/checkout@v4

      - name: Restore LLVM for Android
        uses: actions/cache/restore@v4
        with:
          path: ~/llvm-android
          key: llvm-android-18.1.8-ndk30.0.16248370-minsize-aarch64-v1
          fail-on-cache-miss: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build arm64-v8a debug APK
        env:
          WSE_NDK_VERSION: '30.0.16248370'
          WSE_CMAKE_VERSION: '3.31.6'
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="${sdk_root}"
          export ANDROID_SDK_ROOT="${sdk_root}"

          # Pinned toolchain: the build must not change because the runner
          # image gained a newer NDK or CMake. Installed on demand if absent.
          sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "${sdk_root}/ndk/${WSE_NDK_VERSION}" ]; then
            (yes || true) | "${sdkmanager}" --install "ndk;${WSE_NDK_VERSION}" > /dev/null
          fi
          if [ ! -d "${sdk_root}/cmake/${WSE_CMAKE_VERSION}" ]; then
            (yes || true) | "${sdkmanager}" --install "cmake;${WSE_CMAKE_VERSION}" > /dev/null
          fi
          extra_props=(
            "-Pwse.ndkVersion=${WSE_NDK_VERSION}"
            "-Pwse.cmakeVersion=${WSE_CMAKE_VERSION}"
            "-Pwse.llvmPrefix=${HOME}/llvm-android"
          )
          echo "Gradle props: ${extra_props[*]}"

          gradle -p android assembleDebug --no-daemon "${extra_props[@]}"

      - name: Render launcher screenshots
        env:
          WSE_NDK_VERSION: '30.0.16248370'
          WSE_CMAKE_VERSION: '3.31.6'
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="${sdk_root}"
          export ANDROID_SDK_ROOT="${sdk_root}"
          extra_props=(
            "-Pwse.ndkVersion=${WSE_NDK_VERSION}"
            "-Pwse.cmakeVersion=${WSE_CMAKE_VERSION}"
            "-Pwse.llvmPrefix=${HOME}/llvm-android"
          )

          gradle -p android recordRoborazziDebug --no-daemon "${extra_props[@]}"

      - name: Check debug APK contents
        run: |
          set -euo pipefail
          apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "${apk_path}"
          contents="$(unzip -Z1 "${apk_path}")"
          echo "${contents}" | grep -Fx "lib/arm64-v8a/libwse2.so"
          echo "${contents}" | grep -Fx "lib/arm64-v8a/libSDL3.so"
          echo "${contents}" | grep -Fx "lib/arm64-v8a/libpanvk_hw.so"
          echo "${contents}" | grep -Fx "lib/arm64-v8a/libwse_r0.so"
          # R0 (c): the translator's APK cost (uncompressed and compressed bytes).
          unzip -lv "${apk_path}" | grep -E 'lib/arm64-v8a/lib(wse2|wse_r0)[.]so'
          ls -l "${apk_path}"
          echo "${contents}" | grep -Fx "assets/scripts.txt"
          # Only the self-test fixture may be packaged (BYOA: no other assets).
          extra_assets="$(echo "${contents}" | grep '^assets/' | grep -Fxv "assets/scripts.txt" || true)"
          if [ -n "${extra_assets}" ]; then
            echo "Unexpected APK assets:" >&2
            echo "${extra_assets}" >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wse2-android-selftest-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload launcher screenshots
        uses: actions/upload-artifact@v4
        with:
          name: launcher-screenshots
          path: android/app/build/outputs/roborazzi/**/*.png
          if-no-files-found: error
